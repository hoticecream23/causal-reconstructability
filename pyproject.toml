[project]
name = "rnar"
version = "0.1.0"
description = "Causal reconstructability of SAE features: ablate-and-rescue over sparse feature sets"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.7",           # cu128 wheels start here; install from the pytorch index
    "transformers>=4.56",   # `dtype=` kwarg; `torch_dtype` is gone in v5
    "sae-lens>=6.0",
    "datasets>=2.20",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rnar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
